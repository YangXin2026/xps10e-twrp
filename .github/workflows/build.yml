name: Build TWRP (xps10e)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          docker image prune -af || true
          df -h /

      # AOSP 9 needs python2 + JDK8; the ubuntu-20.04 container has both.
      - name: Build inside ubuntu:20.04 container
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            ubuntu:20.04 bash /src/ci/build.sh

      - name: Collect results
        if: always()
        run: |
          OUT="$GITHUB_WORKSPACE/work/out/target/product/xps10e"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -v "$OUT/recovery.img" "$GITHUB_WORKSPACE/out/recovery.img" || true
          cp -v "$OUT/recovery.zip" "$GITHUB_WORKSPACE/out/recovery.zip" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/out"
          sha256sum "$GITHUB_WORKSPACE/out"/* 2>/dev/null || true
          df -h /

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-xps10e
          path: |
            out/recovery.img
            out/recovery.zip
          if-no-files-found: warn

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          BODY="TWRP for Xiaodu G16 Pro (xps10e), manifest twrp-9.0, run ${GITHUB_RUN_NUMBER}"
          REL=$(curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"${BODY}\",\"draft\":false}")
          ID=$(echo "$REL" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
          echo "release id: $ID"
          for f in out/recovery.img out/recovery.zip; do
            [ -f "$f" ] || continue
            curl -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${ID}/assets?name=$(basename $f)"
            echo
          done
